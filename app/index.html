<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oi Nanda</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#E8603F;--c2:#C44A2C;--soft:#FBE6DE;--tint:#FEF5F1;--ink:#17212B;--ink2:#4B5968;--ink3:#8593A1;--line:#EEE4DC;--bg:#FBF8F5;--ok:#0A5C50;--oksoft:#DDF4EC;--warn:#7A5600;--warnsoft:#FBF0D6;--bad:#9E2B1E;--badsoft:#FBE6E3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--c2)}
.hide{display:none!important}
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;background:var(--c);border-radius:12px;padding:5px 11px 7px 10px;line-height:1}
.logo i{font-style:normal;font-weight:800;font-size:10px;background:#fff;color:var(--c);border-radius:6px 6px 6px 2px;padding:1px 5px 2px;transform:rotate(-5deg);margin-bottom:2px}
.logo b{color:#fff;font-size:20px;font-weight:800;letter-spacing:-.8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;border:1px solid var(--line);background:#fff}
.btn:hover{border-color:var(--ink3)}
.btn.p{background:var(--c);border-color:var(--c);color:#fff}.btn.p:hover{background:var(--c2)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.field input,.field select{border:1px solid #DCD2C9;border-radius:12px;padding:11px 13px;background:#fff;outline:0;min-width:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--c);box-shadow:0 0 0 3px var(--soft)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--soft);color:var(--c2)}
.pill.ok{background:var(--oksoft);color:var(--ok)}.pill.warn{background:var(--warnsoft);color:var(--warn)}.pill.bad{background:var(--badsoft);color:var(--bad)}.pill.grey{background:#EEF1F4;color:var(--ink2)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:420px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:28px 28px 28px 8px;padding:32px;box-shadow:0 30px 60px -40px rgba(23,33,43,.4)}
.auth h1{font-size:24px;letter-spacing:-.6px;margin:18px 0 4px}
.auth p.l{color:var(--ink2);margin-bottom:20px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .sw{margin-top:16px;font-size:13.5px;color:var(--ink2);text-align:center}
.auth .sw a{font-weight:800;cursor:pointer}
/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#C9D2DA;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{margin:0 6px 18px;align-self:flex-start}
.side .co{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.side .co b{display:block;color:#fff;font-size:13.5px}
.side .co span{font-size:12px;color:#9AA7B4}
.side h6{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#7C8995;margin:14px 10px 4px}
.side button.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-weight:600;font-size:14px;color:#C9D2DA}
.side button.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.side button.nav.on{background:rgba(255,255,255,.12);color:#fff}
.side button.nav .soon{margin-left:auto;font-size:10px;font-weight:800;color:#7C8995}
.side .sp{flex:1}
.side .me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.side .me .av{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.side .me b{display:block;color:#fff;font-size:13px;line-height:1.2}
.side .me span{font-size:11.5px;color:#9AA7B4}
.side .me button{margin-left:auto;color:#9AA7B4;font-size:12px;font-weight:700}
main{min-width:0}
.banner{padding:10px 28px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:12px}
.banner.imp{background:#17212B;color:#FFB38A}
.banner.trial{background:var(--warnsoft);color:var(--warn)}
.banner .btn{margin-left:auto}
.page{padding:28px 32px 60px;max-width:1080px}
.page h1{font-size:26px;letter-spacing:-.7px}
.page .sub{color:var(--ink2);margin:4px 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:600}
.stat b{display:block;font-size:30px;letter-spacing:-1px;line-height:1.15;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--c2);display:grid;place-items:center;font-weight:800;flex:none}
.step.done .n{background:var(--oksoft);color:var(--ok)}
.step b{display:block}.step p{color:var(--ink2);font-size:13.5px}
.step .btn,.step .pill{margin-left:auto;flex:none}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:700;padding:0 10px 9px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}
td small{display:block;color:var(--ink3);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--tint);border:1px solid var(--soft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.temp{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:16px;background:#fff;border:1px dashed var(--c);border-radius:10px;padding:8px 12px;display:inline-block;margin:6px 0}
pre{white-space:pre-wrap;font-size:11.5px;color:var(--ink2);max-height:160px;overflow:auto;background:#F6F2EE;border-radius:10px;padding:8px;margin-top:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.empty{color:var(--ink3);text-align:center;padding:26px}

/* conversas */
.page.wide{max-width:none;padding:0}
.cv{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 40px);border-top:1px solid var(--line)}
.cv-list{border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.cv-list .hd{padding:16px 16px 10px}
.cv-list .hd h1{font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cv-items{overflow-y:auto;overflow-x:hidden;flex:1}
.cv-it{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start;text-align:left;width:100%}
.cv-it:hover{background:#FBF8F5}.cv-it.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--c)}
.cv-it .av{width:40px;height:40px;border-radius:50%;background:#5B7DB1;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.cv-it b{display:block;font-size:14px}
.cv-it>span:nth-child(2){min-width:0}.cv-it .pv{display:block;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-it .mt{text-align:right;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cv-it .un{background:var(--c);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.cv-chat{display:flex;flex-direction:column;min-height:0;background:#EFE7DD;background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:14px 14px}
.cv-chat .top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.cv-chat .top b{display:block;font-size:15px}.cv-chat .top span{font-size:12.5px;color:var(--ink2)}
.cv-chat .top .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.msgs{flex:1;overflow:auto;padding:20px 26px;display:flex;flex-direction:column;gap:6px}
.m{max-width:68%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap;word-wrap:break-word}
.m.in{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.m.out{align-self:flex-end;background:#DCF8C6;border-top-right-radius:3px}
.m small{display:block;text-align:right;font-size:10.5px;color:var(--ink3);margin-top:3px}
.m .by{display:block;font-size:11px;font-weight:800;color:var(--c2);margin-bottom:1px}
.m .st.read{color:#34B7F1}.m .st.failed{color:var(--bad)}
.comp{background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:flex-end}
.comp textarea{flex:1;resize:none;border:1px solid #DCD2C9;border-radius:14px;padding:10px 13px;min-height:44px;max-height:140px;outline:0;font:inherit}
.comp textarea:focus{border-color:var(--c)}
.closed{background:var(--warnsoft);color:var(--warn);font-size:13px;font-weight:600;padding:10px 18px;border-top:1px solid #EFD9A6}
.cv-empty{flex:1;display:grid;place-items:center;color:var(--ink3);text-align:center;padding:30px}
.m.sys{align-self:center;background:#FFF6DF;color:#7A5A12;font-size:12px;font-weight:600;box-shadow:none;border-radius:999px;padding:4px 12px;max-width:85%;text-align:center}
.m.out.ai{background:#FFE8DF}.m.out.ai .by{color:var(--c2)}
.human{background:#FDECEC;color:var(--bad);font-size:13px;font-weight:700;padding:9px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #F3CFCF}
.human .btn{margin-left:auto}
.cv-it .hn{background:var(--badsoft);color:var(--bad);font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px}
.comp .sug{flex:none}
.mode{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff}
.mode.auto{background:var(--soft);border-color:var(--c);color:var(--c2)}
.field textarea{border:1px solid #DCD2C9;border-radius:12px;padding:11px 13px;background:#fff;outline:0;font:inherit;resize:vertical;min-height:90px}
.field textarea:focus{border-color:var(--c);box-shadow:0 0 0 3px var(--soft)}
.hint,.field .hint{font-size:12px;color:var(--ink3)}
.ai-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.play{display:flex;flex-direction:column;height:560px;padding:0;overflow:hidden;background:#EFE7DD}
.play .hd{background:#fff;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.play .msgs{padding:14px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes label{border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.modes label b{display:block;color:var(--ink);font-size:13.5px}
.modes input{display:none}.modes label:has(input:checked){border-color:var(--c);background:var(--tint);box-shadow:0 0 0 2px var(--soft)}
/* funil */
.page.board{max-width:none}
.fhd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.fhd .sub{margin:4px 0 0}
.fhd .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fhd input{border:1px solid #DCD2C9;border-radius:999px;padding:8px 14px;outline:0;min-width:200px}
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:calc(100vh - 220px)}
.col{flex:0 0 272px;background:#F3EEE8;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 200px)}
.col.drop{background:var(--soft);outline:2px dashed var(--c)}
.col .ch{padding:4px 6px 6px;display:flex;align-items:baseline;gap:8px}
.col .ch b{font-size:13.5px}.col .ch .ct{font-size:12px;color:var(--ink3);font-weight:700}
.col .ch .vl{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:700}
.col.won .ch b{color:var(--ok)}.col.lost .ch b{color:var(--ink3)}
.col .cards{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px}
.kc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:grab;text-align:left;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kc:hover{border-color:#D9CBBF}.kc.drag{opacity:.4}
.kc b{display:block;font-size:13.5px}.kc .pv{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kc .ft{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.kc .ft .money{color:var(--ok);font-weight:800}.kc .ft .who{margin-left:auto}
.tag{background:#EEF1F4;color:var(--ink2);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(23,33,43,.35);z-index:40;display:flex;justify-content:flex-end}
.ov.center{justify-content:center;align-items:center;padding:20px}
.drawer{width:400px;max-width:100%;background:#fff;height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 40px -30px rgba(0,0,0,.4)}
.modal{width:480px;max-width:100%;background:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.drawer .x,.modal .x{margin-left:auto;font-size:20px;color:var(--ink3);line-height:1}
.srow{display:grid;grid-template-columns:1fr 130px 34px;gap:8px;align-items:center}
.srow input,.srow select{border:1px solid #DCD2C9;border-radius:10px;padding:8px 10px;outline:0;background:#fff}
.stsel{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;max-width:190px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:#F3EEE8;border-radius:16px;padding:8px;min-height:340px;display:flex;flex-direction:column;gap:6px}
.day.today{background:var(--tint);box-shadow:inset 0 0 0 2px var(--soft)}.day.closed{opacity:.6}
.day .dh{padding:4px 6px 6px;font-size:12px;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between}
.day .dh b{font-size:15px;color:var(--ink)}
.ap{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:7px 9px;text-align:left;width:100%;font-size:12.5px}
.ap b{display:block;font-size:13px}.ap span{color:var(--ink2);display:block}
.ap.confirmed{border-left-color:#2F7DD1}.ap.done{border-left-color:var(--ok)}.ap.no_show{border-left-color:var(--bad)}.ap.canceled{border-left-color:#C5CDD5;opacity:.6;text-decoration:line-through}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.hrs{display:grid;grid-template-columns:70px 1fr;gap:8px 12px;align-items:center}
.hrs .rg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hrs input[type=time]{border:1px solid #DCD2C9;border-radius:10px;padding:6px 8px}
.svrow{display:grid;grid-template-columns:1fr 90px 80px 90px 34px;gap:8px;align-items:center}
.svrow input{border:1px solid #DCD2C9;border-radius:10px;padding:8px 10px;outline:0;min-width:0}
.slots{display:flex;flex-wrap:wrap;gap:6px}.slots button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;background:#fff}
.slots button.on{background:var(--c);color:#fff;border-color:var(--c)}
@media (max-width:860px){.wk{grid-template-columns:1fr}.day{min-height:0}.svrow{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.cv{grid-template-columns:1fr;height:auto}.cv-chat{min-height:70vh}.ai-wrap,.modes{grid-template-columns:1fr}}

@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.g4{grid-template-columns:1fr 1fr}.g2,.form2{grid-template-columns:1fr}.page{padding:20px 16px}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const SEG={studio:'Studio ou academia',clinica:'Clínica de estética ou odonto',lancamento:'Lançamento ou infoproduto',outro:'Outro segmento'};
const PLAN={trial:'Teste grátis',oferta:'Oferta do mês',completo:'Completo',rede:'Rede'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const day=v=>v?new Date(v).toLocaleDateString('pt-BR'):'—';
const initials=n=>(n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
async function api(path,opt={}){
  const r=await fetch('/api'+path,{method:opt.method||'GET',headers:opt.body?{'Content-Type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined,credentials:'same-origin'});
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok){const d=data&&data.detail;const msg=Array.isArray(d)?'Confira os campos: '+d.map(x=>x.loc.slice(-1)[0]).join(', '):(d||'Erro '+r.status);const e=new Error(msg);e.status=r.status;throw e}
  return data;
}
let ME=null,VIEW='inicio';

/* ---------- autenticação ---------- */
function authView(mode){
  const signup=mode==='signup';
  $('#root').innerHTML=`<div class="auth"><div class="card">
   <span class="logo"><i>oi</i><b>Nanda</b></span>
   <h1>${signup?'Crie sua conta':'Entrar'}</h1>
   <p class="l">${signup?'7 dias grátis, sem cartão. Em seguida você conecta o WhatsApp.':'Acesse o painel da sua empresa.'}</p>
   <form id="f">
    ${signup?`<div class="field"><label>Seu nome</label><input name="name" required minlength="2" autocomplete="name"></div>
    <div class="field"><label>Nome do negócio</label><input name="company" required minlength="2"></div>
    <div class="field"><label>Segmento</label><select name="segment">${Object.entries(SEG).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="field"><label>WhatsApp do negócio</label><input name="phone" placeholder="(11) 99999-0000" autocomplete="tel"></div>`:''}
    <div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label>Senha ${signup?'(mínimo 8 caracteres)':''}</label><input name="password" type="password" required ${signup?'minlength="8" autocomplete="new-password"':'autocomplete="current-password"'}></div>
    <div class="err" id="e"></div>
    <button class="btn p" type="submit">${signup?'Criar conta e começar':'Entrar'}</button>
   </form>
   <div class="sw">${signup?'Já tem conta? <a data-go="login">Entrar</a>':'Ainda não tem conta? <a data-go="signup">Criar conta grátis</a>'}</div>

function loadFB(appId){return new Promise((ok,bad)=>{if(window.FB)return ok();window.fbAsyncInit=()=>{FB.init({appId,autoLogAppEvents:true,xfbml:false,version:'v21.0'});ok()};
  const sc=document.createElement('script');sc.src='https://connect.facebook.net/pt_BR/sdk.js';sc.async=true;sc.defer=true;sc.crossOrigin='anonymous';sc.onerror=()=>bad(new Error('Não deu para abrir a Meta. Desative o bloqueador de anúncios e tente de novo.'));document.body.appendChild(sc)})}
async function metaSignup(es,own){
  const e=$('#esE');e.textContent='Abrindo a Meta...';
  try{await loadFB(es.app_id)}catch(x){e.textContent=x.message;return}
  let info=null,code=null,done=false;
  const finish=async()=>{if(done||!info||!code)return;done=true;e.textContent='Conectando...';
    try{await api('/wa/signup',{method:'POST',body:{code,waba_id:info.waba_id,phone_number_id:info.phone_number_id,coexistence:info.coex}});toast(info.coex?'WhatsApp conectado. O celular continua funcionando e as conversas antigas estão chegando.':'WhatsApp conectado.');renderWa(own)}
    catch(x){e.textContent=x.message}};
  const onMsg=ev=>{if(!/facebook\.com$/.test(new URL(ev.origin).hostname))return;let d;try{d=JSON.parse(ev.data)}catch(_){return}
    if(d.type!=='WA_EMBEDDED_SIGNUP')return;
    if(String(d.event).startsWith('FINISH')){const x=d.data||{};info={waba_id:x.waba_id,phone_number_id:x.phone_number_id,coex:d.event==='FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING'};
      if(!info.phone_number_id){e.textContent='A Meta não devolveu o número. Se você escolheu só a conta, conecte de novo escolhendo o número.';done=true;return}finish()}
    else if(d.event==='CANCEL'||d.event==='ERROR'){const x=d.data||{};e.textContent=x.error_message?('A Meta avisou: '+x.error_message):'Conexão cancelada antes do fim.';done=true}};
  window.addEventListener('message',onMsg);
  FB.login(r=>{if(r.authResponse&&r.authResponse.code){code=r.authResponse.code;finish()}else if(!done){e.textContent='Conexão cancelada.'}},
    {config_id:es.config_id,response_type:'code',override_default_response_type:true,extras:{setup:{},featureType:'whatsapp_business_app_onboarding'}});
}

    </div><span class="hint">Dá para mudar conversa por conversa. Quando alguém do time responde, a Nanda sai de cena naquela conversa.</span></div>
    <div class="form2"><div class="field"><label>Nome da assistente</label><input name="name" value="${esc(s.name)}" minlength="2" maxlength="30"></div>
     <div class="field"><label>Jeito de falar</label><select name="tone">${[['proximo','Próximo e direto'],['descontraido','Descontraído'],['formal','Mais formal']].map(t=>`<option value="${t[0]}" ${s.tone===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div></div>
    <div class="field"><label>O que ela sabe sobre o negócio</label><textarea name="knowledge" rows="10" maxlength="12000" placeholder="${esc(ex)}">${esc(s.knowledge)}</textarea>
     <span class="hint">Preços, planos, horários, endereço, formas de pagamento, dúvidas comuns. Ela só responde o que estiver aqui; o resto passa para o time.</span></div>
    <div class="field"><label>Quando chamar alguém do time</label><textarea name="handoff" rows="3" maxlength="3000" placeholder="Ex.: quando o cliente quiser fechar o plano anual, pedir desconto, ou falar de cancelamento.">${esc(s.handoff)}</textarea>
     <span class="hint">Pedido de atendente, reclamação e assunto fora do que ela sabe já passam para o time automaticamente.</span></div>
    <div class="row"><button class="btn p">Salvar</button><span class="err" id="aiE"></span>
     <span style="margin-left:auto;font-size:12.5px;color:var(--ink3)">Este mês: ${u.replies||0} respostas · ${u.suggestions||0} sugestões · ${u.tests||0} testes</span></div>
   </form>
   <div class="card play"><div class="hd"><b>Teste a ${esc(s.name)}</b><span class="pill grey">não envia nada</span><button class="btn sm" id="plR" style="margin-left:auto">Limpar</button></div>
    <div class="msgs" id="plM"><div class="m sys">Escreva como se fosse um cliente. Salve antes para ela usar o que você ensinou.</div></div>
    <form class="comp" id="plF"><textarea id="plT" rows="1" placeholder="Oi, quanto custa?"></textarea><button class="btn p">Enviar</button></form></div></div>`;
  $('#aiF').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('.btn.p');b.disabled=true;$('#aiE').textContent='';
    try{await api('/ai/settings',{method:'PUT',body:Object.fromEntries(new FormData(ev.target))});toast('Nanda atualizada.')}catch(e){$('#aiE').textContent=e.message}b.disabled=false};
  const hist=[];const box=$('#plM');
  const draw=()=>{box.innerHTML=hist.length?hist.map(m=>m.dir==='sys'?`<div class="m sys">${esc(m.text)}</div>`:`<div class="m ${m.dir==='in'?'in':'out ai'}">${esc(m.text)}</div>`).join(''):'<div class="m sys">Escreva como se fosse um cliente. Salve antes para ela usar o que você ensinou.</div>';box.scrollTop=box.scrollHeight};
  $('#plR').onclick=()=>{hist.length=0;draw()};
  $('#plT').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#plF').requestSubmit()}};
  $('#plF').onsubmit=async ev=>{ev.preventDefault();const t=$('#plT').value.trim();if(!t)return;$('#plT').value='';hist.push({dir:'in',text:t});hist.push({dir:'sys',text:'digitando...'});draw();
    try{const r=await api('/ai/test',{method:'POST',body:{messages:hist.filter(m=>m.dir!=='sys')}});hist.pop();if(r.reply)hist.push({dir:'out',text:r.reply});if(r.book)hist.push({dir:'sys',text:'Aqui ela agendaria '+(r.book_label||'')+' (no teste nada é agendado)'});if(r.handoff)hist.push({dir:'sys',text:'Aqui ela passaria a conversa para o time · '+(r.reason||'')})}
    catch(e){hist.pop();hist.push({dir:'sys',text:e.message})}draw()};
 },
 async inicio(){
  const team=await api('/team');const num=await api('/wa/number');const u=ME.user;const ai=await api('/ai/settings').catch(()=>null);const sm=await api('/funnel/summary').catch(()=>null);
  $('#page').innerHTML=`<h1>Oi, ${esc(u.name.split(' ')[0])}!</h1><p class="sub">Vamos deixar a Nanda pronta para atender o ${esc(ME.company.name)}.</p>
   ${sm?`<div class="grid g4" style="margin-bottom:14px">
    <button class="card stat" data-to="conversas" style="text-align:left"><span>Esperando resposta</span><b>${sm.waiting}</b></button>
    <button class="card stat" data-to="conversas" style="text-align:left"><span>Pediram atendente</span><b style="color:${sm.needs_human?'var(--bad)':'inherit'}">${sm.needs_human}</b></button>
    <button class="card stat" data-to="funil" style="text-align:left"><span>Contatos novos no mês</span><b>${sm.new_contacts}</b></button>
    <button class="card stat" data-to="funil" style="text-align:left"><span>Vendas no mês</span><b>${sm.won}${sm.won_value?` <small style="font-size:14px;color:var(--ok)">${brl(sm.won_value)}</small>`:''}</b></button></div>`:''}
   <div class="card"><div class="steps">
    <div class="step done"><span class="n">✓</span><div><b>Conta criada</b><p>Sua empresa já está no Oi Nanda.</p></div></div>
    <div class="step ${team.length>1?'done':''}"><span class="n">${team.length>1?'✓':'2'}</span><div><b>Convide seu time</b><p>Cada pessoa com seu acesso e sua fila de conversas.</p></div>${team.length>1?'':'<button class="btn sm" data-to="equipe">Convidar</button>'}</div>
    <div class="step ${num?'done':''}"><span class="n">${num?'✓':'3'}</span><div><b>Conectar o WhatsApp</b><p>${num?'Conectado: '+esc(num.display_phone||''):'Pela API oficial da Meta, junto com o app que você já usa.'}</p></div>${num?'':'<button class="btn sm" data-to="empresa">Conectar</button>'}</div>
    <div class="step ${ai&&ai.knowledge?'done':''}"><span class="n">${ai&&ai.knowledge?'✓':'4'}</span><div><b>Ensinar a Nanda sobre o seu negócio</b><p>Preços, horários e o jeito de falar. Depois ela responde sozinha ou sugere respostas para o time.</p></div>${ai&&ai.knowledge?'':'<button class="btn sm" data-to="nanda">Ensinar</button>'}</div>
   </div></div>`;
  document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>go(b.dataset.to));
 },
 async equipe(){
  const team=await api('/team');const u=ME.user;const canManage=['owner','manager'].includes(u.role);
  $('#page').innerHTML=`<h1>Equipe</h1><p class="sub">Quem tem acesso ao painel do ${esc(ME.company.name)}.</p>
   ${canManage?`<div class="card" style="margin-bottom:14px"><form id="inv" class="row" style="align-items:flex-end">
     <div class="field" style="flex:1;min-width:160px"><label>Nome</label><input name="name" required minlength="2"></div>
     <div class="field" style="flex:1.3;min-width:200px"><label>E-mail</label><input name="email" type="email" required></div>
     <div class="field"><label>Papel</label><select name="role"><option value="agent">Atendente</option><option value="manager">Gestor</option></select></div>
     <button class="btn p">Convidar</button></form><div id="invOut"></div></div>`:''}
   <div class="card"><table><thead><tr><th>Pessoa</th><th>Papel</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>
   ${team.map(m=>`<tr><td><b>${esc(m.name)}</b><small>${esc(m.email)}</small></td><td>${esc(ME.roles[m.role])}</td>
     <td>${m.active?(m.must_change_password?'<span class="pill warn">aguardando 1º acesso</span>':'<span class="pill ok">ativo</span>'):'<span class="pill grey">desativado</span>'}</td>
     <td>${dt(m.last_login_at)}</td>
     <td style="text-align:right">${canManage&&m.role!=='owner'&&m.id!==u.id?`<button class="btn sm" data-reset="${m.id}">Nova senha</button> <button class="btn sm ${m.active?'danger':''}" data-act="${m.id}" data-on="${m.active?0:1}">${m.active?'Desativar':'Reativar'}</button>`:''}</td></tr>`).join('')}
   </tbody></table></div>
   <p class="note" style="margin-top:14px"><b>Dono</b> vê e configura tudo. <b>Gestor</b> convida e acompanha o time. <b>Atendente</b> atende as próprias conversas.</p>`;
  const showTemp=(name,email,temp)=>{$('#invOut').innerHTML=`<div class="note" style="margin-top:14px">Envie para ${esc(name)}: entrar em <b>app.oinanda.com.br</b> com o e-mail <b>${esc(email)}</b> e a senha provisória<br><span class="temp">${esc(temp)}</span><br>No primeiro acesso a pessoa cria a senha dela. Esta senha não aparece de novo.</div>`};
  if($('#inv'))$('#inv').onsubmit=async ev=>{ev.preventDefault();const body=Object.fromEntries(new FormData(ev.target));
    try{const r=await api('/team',{method:'POST',body});await VIEWS.equipe();showTemp(r.member.name,r.member.email,r.temp_password)}catch(e){toast(e.message)}};
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{try{await api('/team/'+b.dataset.act,{method:'PATCH',body:{active:b.dataset.on==='1'}});VIEWS.equipe()}catch(e){toast(e.message)}});
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const m=team.find(x=>x.id===b.dataset.reset);
    try{const r=await api('/team/'+m.id+'/reset',{method:'POST'});await VIEWS.equipe();showTemp(m.name,m.email,r.temp_password)}catch(e){toast(e.message)}});
 },
 async empresa(){
  const c=ME.company,own=ME.user.role==='owner';
  $('#page').innerHTML=`<h1>Empresa</h1><p class="sub">Dados do negócio e do plano.</p>
   <div class="grid g2"><div class="card"><form id="co" style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label>Nome do negócio</label><input name="name" value="${esc(c.name)}" ${own?'':'disabled'}></div>
    <div class="field"><label>Segmento</label><select name="segment" ${own?'':'disabled'}>${Object.entries(SEG).map(([k,v])=>`<option value="${k}" ${k===c.segment?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>WhatsApp do negócio</label><input name="phone" value="${esc(c.phone)}" ${own?'':'disabled'}></div>
    ${own?'<button class="btn p" style="align-self:flex-start">Salvar</button>':'<p class="note">Só o dono da conta altera estes dados.</p>'}</form></div>
   <div class="card"><h3 style="margin-bottom:10px">Plano</h3><p><span class="pill">${esc(PLAN[c.plan]||c.plan)}</span></p>
    ${c.plan==='trial'?`<p style="margin-top:10px;color:var(--ink2)">Teste grátis até ${day(c.trial_ends_at)}. A contratação do plano chega numa próxima etapa.</p>`:''}
    <p style="margin-top:14px;color:var(--ink2);font-size:13px">Cliente desde ${day(c.created_at)}.</p></div></div><div class="card" style="margin-top:14px" id="wa"></div>`;
  renderWa(own);
  if(own)$('#co').onsubmit=async ev=>{ev.preventDefault();try{await api('/company',{method:'PATCH',body:Object.fromEntries(new FormData(ev.target))});await refresh();toast('Dados salvos.')}catch(e){toast(e.message)}};
 },
 async atividade(){
  const rows=await api('/audit');
  $('#page').innerHTML=`<h1>Atividade</h1><p class="sub">Quem fez o quê na conta, nos últimos 180 dias.</p>
   <div class="card">${rows.length?`<table><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th><th>De onde</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td>${dt(r.at)}</td><td>${esc(r.actor)}${r.impersonated_by?'<small>suporte Oi Nanda</small>':''}</td><td>${esc(r.action)}${r.target?`<small>${esc(r.target)}</small>`:''}</td><td><small>${esc(r.ip||'')}</small></td></tr>`).join('')}
   </tbody></table>`:'<div class="empty">Nada registrado ainda.</div>'}</div>`;
 },
 async 'a-visao'(){
  const s=await api('/admin/stats');
  const tile=(l,v)=>`<div class="card stat"><span>${l}</span><b>${v}</b></div>`;
  $('#page').innerHTML=`<h1>Visão geral</h1><p class="sub">Todas as contas do Oi Nanda.</p>
   <div class="grid g4">${tile('Empresas',s.companies)}${tile('Em teste',s.trial)}${tile('Pagantes',s.paying)}${tile('Novas na semana',s.new_week)}
   ${tile('Ativas',s.active)}${tile('Suspensas',s.suspended)}${tile('Usuários',s.users)}${tile('Erros nas últimas 24 h',s.errors_day)}</div>`;
 },
 async 'a-clientes'(){
  const list=await api('/admin/companies');
  $('#page').innerHTML=`<h1>Clientes</h1><p class="sub">${list.length} ${list.length===1?'empresa':'empresas'}.</p>
   <div class="card">${list.length?`<table><thead><tr><th>Empresa</th><th>Dono</th><th>Plano</th><th>Situação</th><th>Criada</th><th></th></tr></thead><tbody>
   ${list.map(c=>`<tr><td><b>${esc(c.name)}</b><small>${esc(SEG[c.segment]||'')} · ${c.users} ${c.users===1?'usuário':'usuários'}</small></td>
    <td>${esc(c.owner?.name||'—')}<small>${esc(c.owner?.email||'')} · último acesso ${dt(c.owner?.last_login_at)}</small></td>
    <td><select data-plan="${c.id}" class="btn sm">${Object.entries(PLAN).map(([k,v])=>`<option value="${k}" ${k===c.plan?'selected':''}>${v}</option>`).join('')}</select>
     ${c.plan==='trial'?`<small>teste até ${day(c.trial_ends_at)}</small>`:''}</td>
    <td>${c.status==='active'?'<span class="pill ok">ativa</span>':'<span class="pill bad">suspensa</span>'}</td>
    <td>${day(c.created_at)}</td>
    <td style="text-align:right;white-space:nowrap">${c.plan==='trial'?`<button class="btn sm" data-ext="${c.id}">+7 dias</button> `:''}<button class="btn sm" data-enter="${c.id}">Entrar</button> <button class="btn sm ${c.status==='active'?'danger':''}" data-st="${c.id}" data-to="${c.status==='active'?'suspended':'active'}">${c.status==='active'?'Suspender':'Reativar'}</button></td></tr>`).join('')}
   </tbody></table>`:'<div class="empty">Nenhuma empresa ainda.</div>'}</div>`;
  document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=async()=>{await api('/admin/companies/'+b.dataset.enter+'/enter',{method:'POST'});VIEW='inicio';await boot()});
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{if(b.dataset.to==='suspended'&&!confirm('Suspender esta conta? O time dela perde o acesso na hora.'))return;await api('/admin/companies/'+b.dataset.st,{method:'PATCH',body:{status:b.dataset.to}});VIEWS['a-clientes']()});
  document.querySelectorAll('[data-ext]').forEach(b=>b.onclick=async()=>{await api('/admin/companies/'+b.dataset.ext,{method:'PATCH',body:{extend_trial_days:7}});toast('Teste estendido em 7 dias.');VIEWS['a-clientes']()});
  document.querySelectorAll('[data-plan]').forEach(s=>s.onchange=async()=>{await api('/admin/companies/'+s.dataset.plan,{method:'PATCH',body:{plan:s.value}});toast('Plano alterado.');if(s.dataset.plan===ME.company.id){await refresh();shell()}else VIEWS['a-clientes']()});
 },
 async 'a-atividade'(){
  const rows=await api('/admin/audit');
  $('#page').innerHTML=`<h1>Atividade geral</h1><p class="sub">Últimos 300 registros de todas as contas.</p>
   <div class="card"><table><thead><tr><th>Quando</th><th>Empresa</th><th>Quem</th><th>O quê</th><th>IP</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td>${dt(r.at)}</td><td>${esc(r.company)}</td><td>${esc(r.actor)}${r.impersonated_by?'<small>suporte</small>':''}</td><td>${esc(r.action)}${r.target?`<small>${esc(r.target)}</small>`:''}</td><td><small>${esc(r.ip||'')}</small></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nada ainda.</td></tr>'}

 },
 async 'a-erros'(){
  const rows=await api('/admin/errors');
  $('#page').innerHTML=`<h1>Erros</h1><p class="sub">Falhas inesperadas da API nos últimos 30 dias.</p>
   <div class="card">${rows.length?rows.map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(r.error)}</b><small style="display:block;color:var(--ink3)">${dt(r.at)} · ${esc(r.method)} ${esc(r.path)}</small><pre>${esc(r.trace)}</pre></div>`).join(''):'<div class="empty">Nenhum erro registrado.</div>'}</div>`;
 }
};
async function refresh(){ME=await api('/auth/me')}
async function boot(){
  try{await refresh()}catch(e){
    if(e.status===403&&/senha/.test(e.message))return passwordView();
    if(e.status===403){$('#root').innerHTML=`<div class="auth"><div class="card"><span class="logo"><i>oi</i><b>Nanda</b></span><h1>Acesso bloqueado</h1><p class="l">${esc(e.message)}</p><button class="btn" id="o">Sair</button></div></div>`;$('#o').onclick=async()=>{await api('/auth/logout',{method:'POST'});authView('login')};return}
    return authView(location.pathname.startsWith('/cadastro')?'signup':'login');
  }
  if(ME.user.must_change_password)return passwordView();
  const gq=new URLSearchParams(location.search).get('google');
  if(gq){history.replaceState(null,'','/');VIEW='agenda';AG.tab='config';shell();toast({ok:'Google Agenda conectado.',cancelado:'Conexão com o Google cancelada.',expirado:'O link expirou. Tente conectar de novo.',erro:'O Google não completou a conexão. Tente de novo.'}[gq]||'');return}
  shell();
}
boot();
</script>
